# 前端容器内的 nginx 配置
#
# 与开发期的 `frontend/vite.config.js` 保持**同一套语义**：
#   · 静态文件 → 前端
#   · `/api/*`  → 去掉 `/api` 前缀后转发给后端
#
# ⚠️ 两处容易踩的地方：
#   1. `proxy_pass http://backend:8000/`（**结尾带斜杠**）才会把 `/api` 前缀剥掉；
#      不带斜杠会把 `/api/xxx` 原样转过去，后端全是 404。
#   2. 问答接口要调 LLM，实测单次 1.5–4 秒，首次请求还要建实体索引（约 3.4 秒），
#      默认 60 秒够用；但**不要**设成很短，否则会看到"提问失败"而后端日志显示正常。

upstream pharmkg_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：任何非文件路径都回 index.html，否则刷新 /ask 之类会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://pharmkg_backend/;   # ⚠️ 结尾斜杠＝剥掉 /api
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;   # 问答要等 LLM，别用默认 60s
    }

    # 静态资源带 hash，可长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
