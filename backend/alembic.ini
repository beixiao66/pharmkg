# Alembic config for pharmkg (L7 session-management minimum).
#
# NOTE: this file must stay pure ASCII. Python's configparser reads it with the
# LOCALE encoding -- on a Chinese Windows that is GBK, and any UTF-8 comment here
# blows up with UnicodeDecodeError before alembic even starts. The explanations
# that would normally live here are in alembic/env.py instead (a .py file is
# always read as UTF-8).
#
# sqlalchemy.url is deliberately empty: alembic/env.py takes the DSN from
# app.config.get_settings(), so the password never enters the repository.
#
# Usage (from backend/):
#     .venv\Scripts\python.exe -m alembic upgrade head
#     .venv\Scripts\python.exe -m alembic current
#     .venv\Scripts\python.exe -m alembic downgrade base

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
